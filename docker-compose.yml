

services:
  postgres-db:
    image: postgres:15.3
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-teslo-shop-postgres-data}
    external: ${POSTGRES_VOLUME_EXTERNAL:-false}
